<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>最小活世界 — 2D 側視(泰拉瑞亞式)</title>
<style>
  :root{--bg:#0e1116;--fg:#e6e6e6;--mut:#8a93a0;--acc:#4da3ff;--good:#46c46a;--bad:#ff5d5d;--bd:#2c3a4e}
  *{box-sizing:border-box;user-select:none}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden}
  #wrap{display:flex;flex-direction:column;height:100%}
  header{padding:5px 10px;border-bottom:1px solid #222a35}
  header h1{margin:0;font-size:13px;font-weight:700}
  header p{margin:1px 0 0;font-size:10px;color:var(--mut)}
  #hud{display:flex;flex-wrap:wrap;gap:4px 10px;padding:5px 10px;font-size:11px;border-bottom:1px solid #222a35;align-items:center}
  #hud b{color:var(--acc);font-variant-numeric:tabular-nums}.cons{color:var(--good)}
  #satwrap{width:90px;height:10px;background:#1a2230;border-radius:5px;overflow:hidden;border:1px solid var(--bd)}
  #sat{height:100%;background:var(--good);width:50%}
  #stage{flex:1;position:relative;overflow:hidden;min-height:0}
  canvas{display:block;width:100%;height:100%;touch-action:none;image-rendering:pixelated}
  #pad{display:flex;gap:6px;padding:7px 10px;border-top:1px solid #222a35;flex-wrap:wrap;justify-content:center}
  .k{font:inherit;font-size:15px;font-weight:700;background:#1a2230;color:var(--fg);border:1px solid var(--bd);
     border-radius:9px;padding:9px 13px;cursor:pointer;min-width:44px}
  .k:active{background:#1f6feb;color:#fff}
  #msg{position:absolute;left:8px;top:8px;font-size:10.5px;color:var(--mut);background:rgba(14,17,22,.7);
    border:1px solid #222a35;border-radius:7px;padding:4px 7px;max-width:80%}
  #dead{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
    background:rgba(14,17,22,.8);font-size:18px;color:var(--bad);gap:10px}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>最小活世界 · 2D 側視（泰拉瑞亞式）</h1>
    <p>太陽從上(地表亮/地下暗)·重力向下(沙會塌)·地表草會長·挖方塊進背包(總量守恆)·餓了吃草。</p>
  </header>
  <div id="hud">
    <span>晝夜 <b id="clock">日</b></span>
    <span>飽足</span><div id="satwrap"><div id="sat"></div></div>
    <span>背包 <b id="bag">0</b></span>
    <span>世界方塊帳 <b id="ledger" class="cons">—</b></span>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="msg">← → 走 · ↑ 跳 · 挖(朝向/下) · 採草 · 吃 · 合成。挖出的方塊進背包,世界對應變少——總方塊帳恆定=守恆。</div>
    <div id="dead"><div>餓死了 ☠</div><button class="k" id="respawn">重新開始</button></div>
  </div>
  <div id="pad">
    <button class="k" id="bL">←</button><button class="k" id="bJ">↑跳</button><button class="k" id="bR">→</button>
    <button class="k" id="bDig">⛏挖</button><button class="k" id="bGr">🌿採</button>
    <button class="k" id="bEat">🍖吃</button><button class="k" id="bCraft">✦合成</button>
  </div>
</div>
<script>
// 2D 側視最小活世界(鏡像 verified Python:守恆+生態+採集/合成;這裡空間=泰拉瑞亞式側視、重力向下、太陽從上)。
const Wc=48, Hc=34;            // 世界格寬高
const SKY=8;                   // 上方天空列數
const AIR=0;                   // 空氣(無方塊)
// 方塊種類:每種一個質量(方塊帳)+顏色。GRASS=地表土長草(可採)。
const T={ air:0, 土:1, 石:2, 礦:3, 沙:4, 水:5, 火:6, 草:7 };
const MASS={1:1,2:1,3:1,4:1,5:1,6:1,7:0};   // 草(生物量另計);其餘每塊質量1
const COL={1:"#6b4a2f",2:"#6a6f78",3:"#caa24a",4:"#cbb56a",5:"#2f6bd6",6:"#ff5a28",7:"#3aa55a"};
const FALL={4:1,5:1};          // 沙/水 受重力會掉
let g=[], frame=0, bag=[], P=null, paused=false, M0=0;

function key(x,y){return y*Wc+x;}
function inb(x,y){return x>=0&&x<Wc&&y>=0&&y<Hc;}
function get(x,y){return inb(x,y)?g[key(x,y)]:{k:T.石};}     // 界外當實心
function solid(x,y){const c=get(x,y);return c.k!==AIR;}

function gen(){
  g=new Array(Wc*Hc); bag=[]; frame=0;
  // 地表線(起伏)
  const surf=[]; let h=SKY+6;
  for(let x=0;x<Wc;x++){ h+=(Math.random()<.5?-1:1)*(Math.random()<.35?1:0); h=Math.max(SKY+3,Math.min(SKY+10,h)); surf[x]=h; }
  for(let y=0;y<Hc;y++)for(let x=0;x<Wc;x++){
    let k=AIR, b=0, n=0;
    if(y>surf[x]){ k=T.土; if(y>surf[x]+6) k=T.石; if(k===T.石&&Math.random()<.06)k=T.礦; }
    else if(y===surf[x]){ k=T.草; b=0.3+0.5*Math.random(); n=4; }   // 地表土=草(含生物量+養分)
    // 礦穴/水/火 點綴
    if(k===T.石&&Math.random()<.04)k=AIR;
    if(k===T.土&&y>surf[x]+1&&Math.random()<.03)k=T.水;
    if(k===T.石&&y>SKY+16&&Math.random()<.015)k=T.火;
    g[key(x,y)]={k,b,n};
  }
  // 角色放地表中央上方
  let sx=Wc>>1; P={x:sx,y:surf[sx]-1,sat:55,alive:true,vy:0,face:1};
  M0=ledger(); document.getElementById("dead").style.display="none";
}
// 方塊帳 = 世界非空氣格數 + 背包「方塊」數(食物=可再生地表生命,不計)。挖塊→背包、放回、重力搬移 都恆定。
function ledger(){ let m=0; for(const c of g){ if(c&&c.k!==AIR) m+=1; } for(const it of bag){ if(!it.food) m+=it.amt; } return m; }
function bagCount(){ return bag.length; }

// 太陽:每欄從上往下,遇實心衰減 → 光(地表亮、地下暗)
let light=[];
function calcLight(){
  light=new Array(Wc*Hc).fill(0);
  const ph=(frame%900)/900, day=Math.max(.15,1-2*Math.abs(ph-.5));   // 晝夜
  for(let x=0;x<Wc;x++){ let l=day;
    for(let y=0;y<Hc;y++){ light[key(x,y)]=l; if(solid(x,y)) l*=0.55; else l*=0.96; l=Math.max(0,l); } }
}

// 重力:沙/水 由下往上掃,落入下方空氣(方塊只搬不生→守恆)
function gravityStep(){
  for(let y=Hc-2;y>=0;y--)for(let x=0;x<Wc;x++){
    const c=g[key(x,y)]; if(!c||!FALL[c.k])continue;
    if(get(x,y+1).k===AIR){ g[key(x,y+1)]=c; g[key(x,y)]={k:AIR,b:0,n:0}; }
    else if(c.k===T.水){ // 水會往側邊流
      const d=Math.random()<.5?-1:1;
      if(get(x+d,y+1).k===AIR){g[key(x+d,y+1)]=c;g[key(x,y)]={k:AIR,b:0,n:0};}
      else if(get(x+d,y).k===AIR){g[key(x+d,y)]=c;g[key(x,y)]={k:AIR,b:0,n:0};}
    }
  }
}
// 生態:草(地表、有光)生長(養分→生物量)、播種鄰格地表土、過密則枯回養分。守恆(養分↔生物量)。
function ecoStep(){
  for(let x=0;x<Wc;x++)for(let y=0;y<Hc;y++){
    const c=g[key(x,y)]; if(!c)continue;
    if(c.k===T.草){ const s=light[key(x,y)];
      c.b += 0.02*s*(1-c.b/1.2); c.b -= 0.004*c.b;                    // 草:太陽長、自然凋(可再生地表生命)
      // 播種:鄰格若是裸土(上方空氣、曬得到)→ 變草(土→草仍是1格,方塊帳不變)
      if(c.b>0.8){ for(const dx of [1,-1]){ const nb=get(x+dx,y);
        if(nb.k===T.土&&get(x+dx,y-1).k===AIR&&(nb.b||0)<0.05){ nb.k=T.草; nb.b=0.1; c.b-=0.05; } } }
    }
  }
}

// 角色物理:重力下落;走;跳;挖;採;吃;合成
function tick(){
  if(P.alive){
    // 重力
    if(get(P.x,P.y+1).k===AIR){ P.y++; }
    P.sat-=0.008; if(P.sat<=0){P.alive=false;document.getElementById("dead").style.display="flex";}
  }
}
function move(d){ P.face=d; const nx=P.x+d;
  if(!solid(nx,P.y)){ P.x=nx; if(get(nx,P.y+1).k===AIR&&get(nx,P.y+2).k===AIR){} }     // 走
  else if(!solid(nx,P.y-1)&&get(nx,P.y).k!==T.水){ P.x=nx; P.y--; }                      // 爬一階
  P.sat-=0.01;
}
function jump(){ // 若頭上空、往上兩格(簡化跳)
  if(get(P.x,P.y-1).k===AIR){ P.y--; if(get(P.x,P.y-1).k===AIR)P.y--; P.sat-=0.02; }
}
function digAt(x,y){ const c=get(x,y); if(!inb(x,y)||c.k===AIR||c.k===T.火)return false;
  if(c.k===T.草){ // 挖草=取土塊(方塊帳),草生物量當食物(可再生、不計帳)
    bag.push({name:"土",amt:1,food:false}); if(c.b>0.05)bag.push({name:"草",amt:c.b,food:true});
  } else bag.push({name:Object.keys(T).find(k=>T[k]===c.k),amt:1,food:false});
  g[key(x,y)]={k:AIR,b:0}; return true; }
function dig(){ // 挖朝向格,沒有就挖腳下
  if(digAt(P.x+P.face,P.y)) {} else if(digAt(P.x,P.y+1)){} else digAt(P.x+P.face,P.y+1);
  P.sat-=0.02; }
function gather(){ // 採當前/腳下草的生物量(不挖掉土;草=可再生食物)
  for(const[x,y]of[[P.x,P.y],[P.x,P.y+1],[P.x+P.face,P.y]]){ const c=get(x,y);
    if(c.k===T.草&&c.b>0.1){ bag.push({name:"草",amt:c.b,food:true}); c.b=0.05; P.sat-=0.01; msg("採了草"); return; } }
  msg("附近沒有可採的草"); }
function eat(){ const i=bag.findIndex(b=>b.food); if(i<0){msg("背包沒食物——去採草 🌿");return;}
  const f=bag[i]; const gain=10*f.amt; P.sat=Math.min(100,P.sat+gain); bag.splice(i,1); msg("吃了草,飽足 +"+gain.toFixed(0)); }
function combine(){ const idx=bag.map((b,i)=>i).filter(i=>!bag[i].food);   // 只合成方塊(非食物)
  if(idx.length<2){msg("需要兩個方塊才能合成(挖一些)");return;}
  const A=bag[idx[0]],B=bag[idx[1]];
  let n="混合"; if((A.name==="火"&&B.name==="土")||(A.name==="土"&&B.name==="火"))n="燒結";   // 火+土→燒結(湧現)
  const amt=Math.min(A.amt,B.amt); A.amt-=amt;B.amt-=amt; bag=bag.filter(b=>b.amt>1e-6);
  bag.push({name:n,amt:amt*2,food:false}); msg("合成出 "+n+"(火+土→燒結)"); }
function msg(t){ document.getElementById("msg").textContent=t; }

// 渲染
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");let cs=12,oxp=0,oyp=0;
function resize(){const st=document.getElementById("stage");cv.width=st.clientWidth*devicePixelRatio;cv.height=st.clientHeight*devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); cs=Math.max(8,Math.min(st.clientWidth/Wc, st.clientHeight/Hc));
  oxp=(st.clientWidth-cs*Wc)/2; oyp=(st.clientHeight-cs*Hc)/2; }
addEventListener("resize",resize);
function shade(col,l){ const m=/(\d+),(\d+),(\d+)/.exec(col)||[]; // 非rgb→直接乘亮度近似(hex)
  const r=parseInt(col.slice(1,3),16),gg=parseInt(col.slice(3,5),16),bb=parseInt(col.slice(5,7),16);
  const f=0.25+0.75*Math.min(1,l); return `rgb(${r*f|0},${gg*f|0},${bb*f|0})`; }
function draw(){
  // 天空(隨晝夜)
  const ph=(frame%900)/900, day=Math.max(.1,1-2*Math.abs(ph-.5));
  ctx.fillStyle=`rgb(${20+90*day|0},${30+110*day|0},${50+150*day|0})`; ctx.fillRect(0,0,cv.width,cv.height);
  for(let y=0;y<Hc;y++)for(let x=0;x<Wc;x++){ const c=g[key(x,y)]; if(!c||c.k===AIR)continue;
    const px=oxp+x*cs,py=oyp+y*cs,l=light[key(x,y)];
    ctx.fillStyle=shade(COL[c.k],l); ctx.fillRect(px,py,cs+0.5,cs+0.5);
    if(c.k===T.草&&c.b>0.05){ ctx.fillStyle=`rgba(90,220,110,${Math.min(.9,.3+c.b)})`; ctx.fillRect(px,py-cs*0.35,cs,cs*0.4); }
  }
  // 角色
  if(P){ const px=oxp+P.x*cs,py=oyp+P.y*cs; ctx.fillStyle=P.alive?"#fff":"#888";
    ctx.fillRect(px+cs*0.2,py+cs*0.1,cs*0.6,cs*0.8); ctx.fillStyle="#111";
    ctx.fillRect(px+(P.face>0?cs*0.55:cs*0.3),py+cs*0.25,cs*0.15,cs*0.15); }
  // HUD
  document.getElementById("clock").textContent=((frame%900)/900<.5)?"日 ☀":"夜 ☾";
  const sp=P?Math.max(0,Math.min(100,P.sat)):0;const sb=document.getElementById("sat");sb.style.width=sp+"%";
  sb.style.background=sp<20?"#ff5d5d":sp<50?"#ffb454":"#46c46a";
  document.getElementById("bag").textContent=bagCount();
  document.getElementById("ledger").textContent=ledger().toFixed(1)+"/"+M0.toFixed(1);
}
let t2=0;
function loop(){ if(!paused){ calcLight(); if(frame%2===0)gravityStep(); if(frame%4===0)ecoStep(); tick(); frame++; } draw(); requestAnimationFrame(loop); }

// 點畫面=挖那格(若在角色附近)
function tap(px,py){ const x=Math.floor((px-oxp)/cs),y=Math.floor((py-oyp)/cs);
  if(Math.abs(x-P.x)<=1&&Math.abs(y-P.y)<=1){ digAt(x,y); P.sat-=0.02; } }
cv.addEventListener("pointerdown",e=>{const r=cv.getBoundingClientRect();tap(e.clientX-r.left,e.clientY-r.top);});
const B=(id,fn)=>document.getElementById(id).onclick=fn;
B("bL",()=>move(-1));B("bR",()=>move(1));B("bJ",jump);B("bDig",dig);B("bGr",gather);B("bEat",eat);B("bCraft",combine);
B("respawn",()=>{gen();resize();});
addEventListener("keydown",e=>{const m={ArrowLeft:()=>move(-1),ArrowRight:()=>move(1),ArrowUp:jump,a:()=>move(-1),d:()=>move(1),w:jump,
  z:dig,x:gather,c:eat,v:combine}[e.key];if(m){m();e.preventDefault();}});
gen();resize();loop();
</script>
</body>
</html>
