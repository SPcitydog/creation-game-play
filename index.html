<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>最小活世界 — 生態 + 角色求生</title>
<style>
  :root{--bg:#0e1116;--fg:#e6e6e6;--mut:#8a93a0;--acc:#4da3ff;--good:#46c46a;--bad:#ff5d5d;--bd:#2c3a4e}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;-webkit-tap-highlight-color:transparent}
  #wrap{display:flex;flex-direction:column;height:100%}
  header{padding:6px 11px;border-bottom:1px solid #222a35}
  header h1{margin:0;font-size:14px;font-weight:700}
  header p{margin:2px 0 0;font-size:10.5px;color:var(--mut)}
  #hud{display:flex;flex-wrap:wrap;gap:5px 12px;padding:6px 11px;font-size:11.5px;border-bottom:1px solid #222a35;align-items:center}
  #hud b{color:var(--acc);font-variant-numeric:tabular-nums}.cons{color:var(--good)}
  #satwrap{width:120px;height:11px;background:#1a2230;border-radius:6px;overflow:hidden;border:1px solid var(--bd)}
  #sat{height:100%;background:var(--good);width:50%}
  #stage{flex:1;position:relative;overflow:hidden;min-height:0}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #info{position:absolute;left:9px;bottom:9px;font-size:10.5px;color:var(--mut);
    background:rgba(14,17,22,.72);border:1px solid #222a35;border-radius:8px;padding:5px 8px;max-width:72%}
  .sbtn{font:inherit;font-size:11px;background:#1a2230;color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:3px 9px;cursor:pointer}
  .sbtn.on{background:#1f6feb;color:#fff;border-color:#1f6feb}
  #dead{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
    background:rgba(14,17,22,.78);font-size:18px;color:var(--bad);gap:10px}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>最小活世界 · 生態 + 角色求生</h1>
    <p>會呼吸的生態(植物隨日照長/枯)+ 角色靠採集進食求生。能量太陽→世界→太空穿流、物質循環,總帳恆定=守恆。</p>
  </header>
  <div id="hud">
    <span>晝夜 <b id="clock">日</b></span>
    <span>飽足</span><div id="satwrap"><div id="sat"></div></div>
    <span>背包 <b id="bag">0</b></span>
    <span>能量帳 <b id="eledger" class="cons">—</b></span>
    <span>物質帳 <b id="mledger" class="cons">—</b></span>
    <button class="sbtn on" id="auto">自動求生</button>
    <button class="sbtn" id="combineBtn">合成前兩格</button>
    <button class="sbtn" id="reset">↻</button>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="info">綠=植物(生態在長);◉=角色。自動求生中——餓了會自己找植物吃。點任一格=指揮角色走過去採集。看上方總帳:全程恆定。</div>
    <div id="dead"><div>角色餓死了 ☠</div><button class="sbtn" id="respawn">重新開始</button></div>
  </div>
</div>
<script>
// 最小活世界(JS 鏡像 verified Python living_world:生態循環+太陽穿流+採集/合成+角色求生,皆守恆)。
// ★Python(living_world/eco/creation_engine) 為驗證過真值;此為可摸的窗口。
const E=0,ST=1,D=2,S=3,R=4,L=5;
const clamp01=x=>x<0?0:x>1?1:x, V=(...a)=>a.map(clamp01);
const SEEDS={"水":V(.3,.15,.5,.5,.3,.3),"火":V(.8,.05,.15,.85,.8,.4),"土":V(.22,.42,.58,.05,.18,.22),
 "石":V(.22,.78,.4,.05,.08,.18),"氣":V(.42,.05,.1,.78,.32,.5),"光":V(.7,.05,.05,.88,.22,.88)};
// 合成:14 規則(移植自 creation_engine_v2),條件用屬性=P0
const mx=(a,b,i)=>Math.max(a[i],b[i]),mn=(a,b,i)=>Math.min(a[i],b[i]),av=(a,b,i)=>(a[i]+b[i])/2;
const RULES=[
 ["電漿",(a,b)=>{if(mx(a,b,E)>.7&&mx(a,b,L)>.45&&mn(a,b,S)>.72&&mx(a,b,R)>.55&&mx(a,b,D)<.2)return V(.97,0,.05,1,.9,1);}],
 ["玻璃",(a,b)=>{if(mx(a,b,E)>.68&&mn(a,b,E)<.45){const lo=a[E]<=b[E]?a:b;if(lo[ST]>.75&&lo[D]>.35&&lo[S]<.2)return V(.4,.2,lo[D]+.05,0,lo[R]-.05,lo[L]+.3);}}],
 ["淬火",(a,b)=>{for(const[h,c]of[[a,b],[b,a]])if(h[E]>.62&&h[ST]>.6&&c[E]<.4&&c[S]>=.35&&c[S]<=.7)return V(.25,Math.min(.95,h[ST]+.1),h[D]+.08,0,h[R]-.15,h[L]-.05);}],
 ["燒結",(a,b)=>{if(mx(a,b,E)>.65&&mn(a,b,E)<.5){const lo=a[E]<=b[E]?a:b;if(lo[ST]>=.3&&lo[ST]<=.7&&lo[D]>.5&&lo[S]<.25&&lo[R]<.4)return V(.3,Math.min(.8,lo[ST]+.3),lo[D]+.1,0,lo[R]-.1,lo[L]+.05);}}],
 ["汽化",(a,b)=>{for(const[h,v]of[[a,b],[b,a]])if(h[E]>.65&&v[S]>.4&&v[D]<.6)return V(v[E]-.3,v[ST],.1,1,v[R]+.05,v[L]);}],
 ["泥化",(a,b)=>{for(const[l,s]of[[a,b],[b,a]])if(l[S]>=.35&&l[S]<=.7&&l[ST]<.35&&s[S]<.25&&s[ST]<.5&&s[D]>=.4&&s[D]<=.75)return V(av(a,b,E)*.7,Math.min(.5,av(a,b,ST)+.12),av(a,b,D)*.9,.15,av(a,b,R)*.7,mn(a,b,L));}],
 ["冷凝",(a,b)=>{if(mn(a,b,E)<.35&&mx(a,b,D)>=.4&&mx(a,b,D)<=.75&&mx(a,b,S)>.75&&mx(a,b,L)<.55)return V(.25,.15,.55,.5,.25,av(a,b,L));}],
];
function react(a,b){for(const[n,f]of RULES){const o=f(a,b);if(o)return[n,o];}return["混成",V(...[0,1,2,3,4,5].map(k=>av(a,b,k)))];}
function describe(v){const t=[];t.push(v[E]>.66?"灼熱":v[E]>.33?"溫":"冰冷");t.push(v[S]>.7?"氣":v[S]>.3?"液":"固");if(v[ST]>.6)t.push("硬");if(v[R]>.6)t.push("易燃");return t.join("·");}

// 世界:六角(尖頂),每格 amounts{土石水火植枯}。生態(土↔植↔枯,太陽驅動)。
const RAD=6,DIRS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const KIND={"土":SEEDS["土"],"植":V(.32,.30,.58,.55,.45,.55),"枯":V(.18,.25,.58,.10,.30,.30),"石":SEEDS["石"],"水":SEEDS["水"],"火":SEEDS["火"]};
const KER={},KD={};for(const k in KIND){KER[k]=KIND[k][E]+KIND[k][R];KD[k]=KIND[k][D];}
const GROW=.4,KN=3,MAXB=9,RESP=.045,DECOMP=.05,SUN=.05,LAT=6,DAY=600;
let W={},frame=0,sunGiven=0,released=0,bag=[],ag=null,paused=false,auto=true,M0=0,S0=0;

function build(){ W={};frame=0;sunGiven=0;released=0;bag=[];
 for(let q=-RAD;q<=RAD;q++)for(let r=-RAD;r<=RAD;r++){ if(Math.abs(q+r)>RAD)continue;
   const c={"土":8+4*Math.random(),"石":2+3*Math.random(),"水":1+2*Math.random(),"火":0,"植":0,"枯":0};
   if(Math.abs(r)<=3&&Math.random()<.5)c["植"]=1+Math.random()*2;
   if(Math.random()<.05)c["火"]=5+3*Math.random();
   W[q+","+r]=c; }
 ag={q:0,r:0,sat:50,alive:true};
 M0=matter();S0=superE(); document.getElementById("dead").style.display="none";
}
const cells=()=>Object.keys(W);
const nbrs=(q,r)=>DIRS.map(([dq,dr])=>(q+dq)+","+(r+dr)).filter(k=>W[k]);
function sunAt(r){const lat=Math.max(0,1-Math.abs(r)/LAT),ph=(frame%DAY)/DAY;return SUN*lat*Math.max(0,1-2*Math.abs(ph-.5));}
function matter(){let m=0;for(const k in W)for(const x in W[k])m+=KD[x]*W[k][x];for(const b of bag)m+=b.v[D]*b.amt;return m;}
function worldE(){let e=0;for(const k in W)for(const x in W[k])e+=KER[x]*W[k][x];for(const b of bag)e+=(b.v[E]+b.v[R])*b.amt;return e;}
function superE(){return worldE()+(ag?ag.sat:0)-sunGiven+released;}

function ecoStep(){
 for(const k in W){const[q,r]=k.split(",").map(Number),c=W[k],s=sunAt(r);let N=c["土"],B=c["植"],Dd=c["枯"];
   let g=Math.min(GROW*s*(N/(N+KN))*(1-B/MAXB)*(B+.15),N); B+=g;N-=g;sunGiven+=g*(KER["植"]-KER["土"]);
   let rp=RESP*B;B-=rp;Dd+=rp;released+=rp*(KER["植"]-KER["枯"]);
   let dc=DECOMP*Dd;Dd-=dc;N+=dc;released+=dc*(KER["枯"]-KER["土"]);
   c["土"]=N;c["植"]=B;c["枯"]=Dd; }
 const mv=[];for(const k in W){const[q,r]=k.split(",").map(Number);if(W[k]["植"]>5){const ns=nbrs(q,r);if(ns.length){const t=ns.reduce((a,b)=>W[a]["植"]<W[b]["植"]?a:b);if(W[t]["植"]<W[k]["植"])mv.push([k,t,Math.min(.6,W[k]["植"]*.1)]);}}}
 for(const[s,t,a]of mv){W[s]["植"]-=a;W[t]["植"]+=a;}
}
function gather(kind,amt){const k=ag.q+","+ag.r,c=W[k];if(!c||c[kind]<=0)return;const take=Math.min(amt,c[kind]);c[kind]-=take;
 const ex=bag.find(b=>b.name===kind);if(ex)ex.amt+=take;else bag.push({name:kind,v:KIND[kind].slice(),amt:take});}
function eat(i){const f=bag[i];if(!f)return;const ef=(f.v[E]+f.v[R])*f.amt,mf=f.v[D]*f.amt,wa=mf/KD["枯"],gain=ef-KER["枯"]*wa;
 W[ag.q+","+ag.r]["枯"]+=wa; bag.splice(i,1); ag.sat+=gain;}
function combine(){ if(bag.length<2)return; const A=bag[0],B=bag[1],amt=Math.min(A.amt,B.amt);
 const[n,v]=react(A.v,B.v); A.amt-=amt;B.amt-=amt; bag=bag.filter(b=>b.amt>1e-9);
 bag.push({name:n,v:v,amt:amt}); document.getElementById("info").textContent="合成出 "+n+"("+describe(v)+")";}
function agentTick(){ if(!ag.alive)return;
 if(auto){ const c=W[ag.q+","+ag.r]; const fi=bag.findIndex(b=>(b.v[E]+b.v[R])>.6);
   if(ag.sat<60&&fi>=0)eat(fi);
   else if(c["植"]>.5)gather("植",Math.min(4,c["植"]));
   else{ // 朝最近最多植走
     let best=null,bv=-1;for(const k in W){if(W[k]["植"]>bv){bv=W[k]["植"];best=k;}}
     const[bq,br]=best.split(",").map(Number),ns=nbrs(ag.q,ag.r);
     if(ns.length){const t=ns.reduce((a,b)=>(Math.abs(a.split(",")[0]-bq)+Math.abs(a.split(",")[1]-br))<(Math.abs(b.split(",")[0]-bq)+Math.abs(b.split(",")[1]-br))?a:b);
       const[tq,tr]=t.split(",").map(Number);ag.q=tq;ag.r=tr;ag.sat-=.02;released+=.02;} } }
 else if(ag.tgt){ const ns=nbrs(ag.q,ag.r); if(ns.length){const[tq,tr]=ag.tgt;
   const t=ns.reduce((a,b)=>(Math.abs(a.split(",")[0]-tq)+Math.abs(a.split(",")[1]-tr))<(Math.abs(b.split(",")[0]-tq)+Math.abs(b.split(",")[1]-tr))?a:b);
   const[nq,nr]=t.split(",").map(Number);ag.q=nq;ag.r=nr;ag.sat-=.02;released+=.02;}
   const c=W[ag.q+","+ag.r];if(c["植"]>.5)gather("植",Math.min(4,c["植"]));
   const fi=bag.findIndex(b=>(b.v[E]+b.v[R])>.6);if(ag.sat<60&&fi>=0)eat(fi);
   if(ag.q===ag.tgt[0]&&ag.r===ag.tgt[1])ag.tgt=null; }
 ag.sat-=.05;released+=.05; if(ag.sat<=0){ag.alive=false;document.getElementById("dead").style.display="flex";} }

// 渲染
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");let size=14,ox=0,oy=0;
function resize(){const st=document.getElementById("stage");cv.width=st.clientWidth*devicePixelRatio;cv.height=st.clientHeight*devicePixelRatio;
 ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ox=st.clientWidth/2;oy=st.clientHeight/2;
 size=Math.max(5,Math.min(st.clientWidth/(Math.sqrt(3)*(2*RAD+2)),st.clientHeight/(1.5*(2*RAD+2))));}
addEventListener("resize",resize);
const hp=(q,r)=>[ox+size*Math.sqrt(3)*(q+r/2),oy+size*1.5*r];
function tcol(t){const c=[[44,70,120],[60,120,150],[90,130,90],[150,140,80],[170,90,60],[180,60,60]];
 const x=clamp01(t)*(c.length-1)|0,f=clamp01(t)*(c.length-1)-x,a=c[x],b=c[Math.min(x+1,5)];
 return`rgb(${a[0]+(b[0]-a[0])*f|0},${a[1]+(b[1]-a[1])*f|0},${a[2]+(b[2]-a[2])*f|0})`;}
function hex(cx,cy){ctx.beginPath();for(let i=0;i<6;i++){const an=Math.PI/180*(60*i-90),x=cx+size*Math.cos(an),y=cy+size*Math.sin(an);i?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.closePath();}
function draw(){ ctx.clearRect(0,0,cv.width,cv.height);
 for(const k in W){const[q,r]=k.split(",").map(Number),c=W[k],[cx,cy]=hp(q,r); const temp=sunAt(r)/SUN; // 用日照當底色暖度
   hex(cx,cy);ctx.fillStyle=tcol(.2+.6*temp);ctx.fill();
   const green=Math.min(1,c["植"]/MAXB); if(green>.02){ctx.fillStyle=`rgba(70,200,90,${.25+.6*green})`;ctx.fill();}
   if(c["火"]>.5){ctx.fillStyle="rgba(255,120,40,.8)";ctx.beginPath();ctx.arc(cx,cy,size*.3,0,7);ctx.fill();}
   ctx.lineWidth=1;ctx.strokeStyle="rgba(0,0,0,.35)";ctx.stroke(); }
 if(ag){const[cx,cy]=hp(ag.q,ag.r);ctx.fillStyle=ag.alive?"#fff":"#888";ctx.beginPath();ctx.arc(cx,cy,size*.42,0,7);ctx.fill();
   ctx.fillStyle="#111";ctx.font=`${size*.5}px sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("◉",cx,cy);}
 document.getElementById("clock").textContent=((frame%DAY)/DAY<.5)?"日 ☀":"夜 ☾";
 const sp=ag?Math.max(0,Math.min(100,ag.sat)):0; const sb=document.getElementById("sat");sb.style.width=sp+"%";sb.style.background=sp<20?"#ff5d5d":sp<50?"#ffb454":"#46c46a";
 document.getElementById("bag").textContent=bag.reduce((s,b)=>s+1,0);
 document.getElementById("eledger").textContent=superE().toFixed(0)+"/"+S0.toFixed(0);
 document.getElementById("mledger").textContent=matter().toFixed(0)+"/"+M0.toFixed(0);}
let acc=0;
function loop(){ if(!paused){ ecoStep(); if(frame%3===0)agentTick(); frame++; } draw(); requestAnimationFrame(loop); }

function pick(px,py){let best=null,bd=1e9;for(const k in W){const[q,r]=k.split(",").map(Number),[cx,cy]=hp(q,r),d=(cx-px)**2+(cy-py)**2;if(d<bd){bd=d;best=k;}}
 if(best&&bd<(size*1.1)**2){const[q,r]=best.split(",").map(Number); auto=false;document.getElementById("auto").classList.remove("on"); if(ag)ag.tgt=[q,r];}}
cv.addEventListener("pointerdown",e=>{const r=cv.getBoundingClientRect();pick(e.clientX-r.left,e.clientY-r.top);});
document.getElementById("auto").onclick=e=>{auto=!auto;e.target.classList.toggle("on",auto);if(auto&&ag)ag.tgt=null;};
document.getElementById("combineBtn").onclick=combine;
document.getElementById("reset").onclick=()=>{build();resize();};
document.getElementById("respawn").onclick=()=>{build();resize();};
build();resize();loop();
</script>
</body>
</html>
